{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slack-steam-status.fullname" . }}
  labels:
    {{- include "slack-steam-status.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_USER_TOKEN: {{ required "secret.slackUserToken is required when secret.create is true" .Values.secret.slackUserToken | quote }}
  SLACK_SIGNING_SECRET: {{ required "secret.slackSigningSecret is required when secret.create is true" .Values.secret.slackSigningSecret | quote }}
  STEAM_API_KEY: {{ required "secret.steamApiKey is required when secret.create is true" .Values.secret.steamApiKey | quote }}
  STEAM_ID: {{ required "secret.steamId is required when secret.create is true" .Values.secret.steamId | quote }}
{{- end }}
